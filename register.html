<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration</title>
</head>
<body>
  <header>
    <h1>Course Registration</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Student Profile</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="register.html">Registration Form</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="registration">
      <h2>Register for a Course</h2>
      <form action="#" method="post">

        <p>
          <label for="name">Full Name:</label><br>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </p>

        <p>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </p>

        <p>
          <label for="dob">Date of Birth:</label><br>
          <input type="date" id="dob" name="dob">
        </p>

        <p>
          <label for="phone">Phone Number:</label><br>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number">
        </p>

        <p>
          <label for="course">Select Course:</label><br>
          <select id="course" name="course" required>
            <option value="">-- Choose a course --</option>
            <option value="cs101">CS101 - Web Technologies</option>
            <option value="cs102">CS102 - Data Structures</option>
            <option value="cs103">CS103 - Database Systems</option>
          </select>
        </p>

        <p>
          <label for="comments">Comments:</label><br>
          <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
        </p>

        <p>
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Student Profile Project. Built with semantic HTML5.</p>
  </footer>
</body>
</html>
